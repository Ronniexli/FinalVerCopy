  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22

  - name: Configure GitHub Pages
    uses: actions/configure-pages@v5

  - name: Install dependencies
    run: npm install

  - name: Build website
    run: npm run build -- --configLoader=bundle --base=/FinalVerCopy/

  - name: Upload website
    uses: actions/upload-pages-artifact@v3
    with:
      path: ./dist
